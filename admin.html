<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Applications - Free Shoots</title>
<link rel="stylesheet" href="/styles.css">
<style>
  body { padding: 24px 16px 64px; }
  .admin-wrap { max-width: 1100px; margin: 0 auto; }

  .admin-head { display: flex; flex-wrap: wrap; align-items: baseline;
                gap: 12px; margin-bottom: 24px; }
  .admin-head h1 { font-family: var(--font-display); font-weight: 800;
                   font-size: 28px; letter-spacing: -.02em; margin: 0; }
  .pill { font-size: 13px; font-weight: 600; color: var(--ink);
          background: var(--signal); border-radius: 999px; padding: 3px 10px; }
  .spacer { flex: 1 1 auto; }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; }
  .mini { font-family: var(--font-sans); font-size: 14px; font-weight: 600;
          padding: 8px 14px; border-radius: 8px; cursor: pointer;
          background: transparent; color: var(--paper);
          border: 1px solid var(--line-strong); }
  .mini:hover { background: var(--ink-3); }

  /* login */
  .gate { max-width: 360px; margin: 14vh auto 0; }
  .gate h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px;
             letter-spacing: -.02em; margin: 0 0 6px; }
  .gate p { color: var(--paper-mute); font-size: 15px; margin: 0 0 22px; }
  .gate input { width: 100%; padding: 13px 14px; font-size: 16px;
                font-family: var(--font-sans); color: var(--paper);
                background: var(--ink-2); border: 1px solid var(--line-strong);
                border-radius: 10px; }
  .gate input:focus { outline: 2px solid var(--signal); outline-offset: 1px; }
  .gate button { width: 100%; margin-top: 12px; padding: 13px;
                 font-family: var(--font-sans); font-size: 16px; font-weight: 700;
                 border: 0; border-radius: 10px; cursor: pointer;
                 background: var(--paper); color: var(--ink); }
  .msg { color: var(--danger); font-size: 14px; margin-top: 12px; min-height: 20px; }

  /* cards: the table collapses to these on a phone */
  .cards { display: grid; gap: 12px; }
  .card { border: 1px solid var(--line); background: var(--ink-2);
          border-radius: 12px; padding: 16px; }
  .card .top { display: flex; justify-content: space-between;
               align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .card .biz { font-family: var(--font-display); font-weight: 700; font-size: 19px;
               letter-spacing: -.01em; }
  .card .when { font-size: 12px; color: var(--paper-mute); white-space: nowrap; }
  .card .who { color: var(--paper-dim); font-size: 15px; margin-bottom: 10px; }
  .card .rows { display: grid; gap: 6px; font-size: 15px; }
  .card .row { display: flex; gap: 10px; }
  .card .k { color: var(--paper-mute); min-width: 78px; flex: none; font-size: 13px;
             text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
  .card a { color: var(--signal); text-decoration: none; }
  .card a:hover { text-decoration: underline; }

  .del { background: none; border: 0; color: var(--paper-mute); font-size: 20px;
         line-height: 1; cursor: pointer; padding: 0 0 0 8px; }
  .del:hover { color: var(--danger); }

  .empty { border: 1px dashed var(--line-strong); border-radius: 12px;
           padding: 48px 24px; text-align: center; color: var(--paper-mute); }
</style>
</head>
<body>

<!-- login gate -->
<div class="gate" id="gate">
  <h1>Applications</h1>
  <p>Sign in to see who applied.</p>
  <form id="login-form" autocomplete="on">
    <input type="password" id="password" name="password" placeholder="Password"
           autocomplete="current-password" required>
    <button type="submit" id="login-btn">Sign in</button>
  </form>
  <div class="msg" id="msg" role="alert"></div>
</div>

<!-- applications -->
<div class="admin-wrap" id="panel" hidden>
  <div class="admin-head">
    <h1>Applications</h1>
    <span class="pill" id="count">0</span>
    <span class="spacer"></span>
    <div class="bar">
      <button class="mini" id="refresh">Refresh</button>
      <button class="mini" id="csv">Export CSV</button>
      <button class="mini" id="logout">Sign out</button>
    </div>
  </div>
  <div class="cards" id="cards"></div>
</div>

<script>
(function () {
  var gate = document.getElementById("gate");
  var panel = document.getElementById("panel");
  var msg = document.getElementById("msg");
  var cards = document.getElementById("cards");
  var countEl = document.getElementById("count");
  var rows = [];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function when(iso) {
    try {
      return new Date(iso).toLocaleString(undefined, {
        month: "short", day: "numeric", hour: "numeric", minute: "2-digit"
      });
    } catch (e) { return iso || ""; }
  }

  function telHref(p) { return "tel:" + String(p || "").replace(/[^0-9+]/g, ""); }

  function igHref(h) {
    var clean = String(h || "").trim().replace(/^@/, "").replace(/^https?:\/\/(www\.)?instagram\.com\//i, "").replace(/\/$/, "");
    return clean ? "https://instagram.com/" + encodeURIComponent(clean) : "";
  }

  function render() {
    countEl.textContent = rows.length;
    if (!rows.length) {
      cards.innerHTML = '<div class="empty">No applications yet.</div>';
      return;
    }
    cards.innerHTML = rows.map(function (r) {
      var type = r["Type of business"] === "Other" && r["Other business type"]
        ? r["Other business type"] : r["Type of business"];
      var ig = igHref(r.Instagram);
      return '' +
        '<div class="card">' +
          '<div class="top">' +
            '<span class="biz">' + esc(r["Business name"]) + '</span>' +
            '<span class="when">' + esc(when(r.createdAt)) + ' <button class="del" data-id="' + esc(r.id) + '" title="Delete">&times;</button></span>' +
          '</div>' +
          '<div class="who">' + esc(r.Name) + '</div>' +
          '<div class="rows">' +
            '<div class="row"><span class="k">Type</span><span>' + esc(type) + '</span></div>' +
            '<div class="row"><span class="k">Phone</span><span><a href="' + esc(telHref(r.Phone)) + '">' + esc(r.Phone) + '</a></span></div>' +
            (ig ? '<div class="row"><span class="k">IG</span><span><a href="' + esc(ig) + '" target="_blank" rel="noopener">' + esc(r.Instagram) + '</a></span></div>' : '') +
          '</div>' +
        '</div>';
    }).join("");
  }

  function load() {
    return fetch("/api/admin/data", { cache: "no-store" })
      .then(function (r) {
        if (r.status === 401) { show(false); return null; }
        return r.json();
      })
      .then(function (j) {
        if (!j) return;
        if (!j.ok) { throw new Error(j.error || "Failed"); }
        rows = j.applications || [];
        show(true);
        render();
      })
      .catch(function (e) { msg.textContent = e.message; });
  }

  function show(authed) {
    gate.hidden = authed;
    panel.hidden = !authed;
  }

  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    msg.textContent = "";
    var btn = document.getElementById("login-btn");
    btn.disabled = true;
    fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password").value })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { msg.textContent = j.error || "Wrong password."; return; }
        document.getElementById("password").value = "";
        return load();
      })
      .catch(function () { msg.textContent = "Could not sign in."; })
      .then(function () { btn.disabled = false; });
  });

  document.getElementById("refresh").addEventListener("click", load);

  document.getElementById("logout").addEventListener("click", function () {
    fetch("/api/admin/logout", { method: "POST" }).then(function () {
      rows = [];
      show(false);
    });
  });

  cards.addEventListener("click", function (e) {
    var btn = e.target.closest(".del");
    if (!btn) return;
    if (!confirm("Delete this application? This cannot be undone.")) return;
    btn.disabled = true;
    fetch("/api/admin/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: btn.getAttribute("data-id") })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { alert(j.error || "Could not delete."); btn.disabled = false; return; }
        return load();
      })
      .catch(function () { alert("Could not delete."); btn.disabled = false; });
  });

  document.getElementById("csv").addEventListener("click", function () {
    var cols = ["createdAt", "Name", "Business name", "Type of business", "Other business type", "Instagram", "Phone"];
    var out = [cols.join(",")];
    rows.forEach(function (r) {
      out.push(cols.map(function (c) {
        return '"' + String(r[c] == null ? "" : r[c]).replace(/"/g, '""') + '"';
      }).join(","));
    });
    var blob = new Blob([out.join("\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "free-shoot-applications.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  });

  // if the cookie is still good, go straight in
  load();
})();
</script>
</body>
</html>
